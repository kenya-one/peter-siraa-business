<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Peter Siraa Land</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12181B">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
/* ===== Design tokens ===== */
:root {
  --ink: #12181B;
  --navy: #1B2A3D;
  --navy-light: #26374E;
  --brass: #B8863B;
  --brass-light: #D9B876;
  --parchment: #F5F3EE;
  --parchment-dim: #EAE6DC;
  --slate: #5C6570;
  --white: #FFFFFF;
  --font-display: "Fraunces", serif;
  --font-body: "Inter", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
  --radius: 4px;
  --shadow: 0 12px 32px rgba(18, 24, 27, 0.12);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--parchment);
  color: var(--ink);
  line-height: 1.55;
}

a { color: inherit; }

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 600;
  margin: 0;
  color: var(--navy);
}

.mono {
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
}

.container {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ===== Header ===== */
.site-header {
  background: var(--ink);
  color: var(--parchment);
  position: sticky;
  top: 0;
  z-index: 50;
}

.site-header .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 18px;
  padding-bottom: 18px;
}

.logo {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--parchment);
  text-decoration: none;
  letter-spacing: 0.01em;
}

.logo span { color: var(--brass-light); }

.site-header nav a {
  color: var(--parchment-dim);
  text-decoration: none;
  font-size: 0.92rem;
  margin-left: 28px;
  transition: color 0.15s ease;
}

.site-header nav a:hover { color: var(--brass-light); }

/* ===== Hero ===== */
.hero {
  background: var(--navy);
  color: var(--parchment);
  position: relative;
  overflow: hidden;
  padding: 96px 0 88px;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.08;
  background-image:
    repeating-linear-gradient(0deg, var(--parchment) 0 1px, transparent 1px 96px),
    repeating-linear-gradient(90deg, var(--parchment) 0 1px, transparent 1px 96px);
  pointer-events: none;
}

.hero .container { position: relative; }

.hero-eyebrow {
  font-family: var(--font-mono);
  color: var(--brass-light);
  font-size: 0.8rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 18px;
}

.hero h1 {
  color: var(--white);
  font-size: clamp(2.2rem, 5vw, 3.6rem);
  max-width: 15ch;
  line-height: 1.08;
}

.hero p {
  max-width: 46ch;
  color: var(--parchment-dim);
  font-size: 1.08rem;
  margin-top: 22px;
}

.hero-actions {
  margin-top: 36px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  border-radius: var(--radius);
  font-size: 0.92rem;
  font-weight: 600;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.btn:hover { transform: translateY(-1px); }

.btn-brass {
  background: var(--brass);
  color: var(--ink);
}

.btn-outline {
  border-color: rgba(245, 243, 238, 0.35);
  color: var(--parchment);
}

.btn-navy {
  background: var(--navy);
  color: var(--white);
}

.btn-block { width: 100%; justify-content: center; }

/* ===== Listings section ===== */
.listings {
  padding: 72px 0 96px;
}

.section-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 36px;
  flex-wrap: wrap;
  gap: 12px;
}

.section-heading h2 { font-size: 1.8rem; }

.section-heading .count {
  font-family: var(--font-mono);
  color: var(--slate);
  font-size: 0.85rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 28px;
}

.card {
  background: var(--white);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  position: relative;
  display: flex;
  flex-direction: column;
}

/* Signature "deed seal" corner mark */
.card::after {
  content: "TITLE";
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 2;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  color: var(--ink);
  background: var(--brass-light);
  padding: 4px 8px;
  border-radius: 100px;
}

.card-image {
  position: relative;
  aspect-ratio: 4 / 3;
  background: var(--parchment-dim);
  overflow: hidden;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.card-image .thumbs {
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  gap: 6px;
}

.card-image .thumbs button {
  flex: 1;
  height: 4px;
  border: none;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.5);
  cursor: pointer;
  padding: 0;
}

.card-image .thumbs button.active { background: var(--brass); }

.card-body {
  padding: 20px 22px 22px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.card-location {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.card-body h3 { font-size: 1.2rem; }

.card-price {
  font-family: var(--font-mono);
  color: var(--brass);
  font-weight: 700;
  font-size: 1.05rem;
}

.card-desc {
  color: var(--slate);
  font-size: 0.92rem;
  flex: 1;
}

.card-contacts {
  display: flex;
  gap: 8px;
  margin-top: 6px;
  flex-wrap: wrap;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 12px;
  border-radius: var(--radius);
  font-size: 0.82rem;
  font-weight: 600;
  text-decoration: none;
  border: 1px solid var(--parchment-dim);
  color: var(--navy);
  background: var(--parchment);
  cursor: pointer;
  transition: background 0.12s ease;
}

.icon-btn:hover { background: var(--parchment-dim); }

.icon-btn.whatsapp { color: #1f7a4d; border-color: #d6ead9; }
.icon-btn.enquire { color: var(--navy); }
.icon-btn.social { color: var(--brass); }

.empty-state, .loading-state {
  padding: 48px 24px;
  text-align: center;
  color: var(--slate);
  background: var(--white);
  border-radius: var(--radius);
  font-family: var(--font-mono);
  font-size: 0.9rem;
}

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(18, 24, 27, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--white);
  border-radius: var(--radius);
  max-width: 440px;
  width: 100%;
  padding: 32px;
  position: relative;
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  border: none;
  background: none;
  font-size: 1.3rem;
  cursor: pointer;
  color: var(--slate);
}

.modal h3 { margin-bottom: 6px; }
.modal .modal-sub {
  color: var(--slate);
  font-size: 0.88rem;
  margin-bottom: 20px;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 6px;
}

.field input, .field textarea, .field select {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--parchment-dim);
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: 0.92rem;
  background: var(--parchment);
}

.field textarea { min-height: 90px; resize: vertical; }

.form-note {
  font-size: 0.8rem;
  color: var(--slate);
  margin-top: 4px;
}

.form-success {
  background: #ECF6EF;
  color: #1f7a4d;
  padding: 12px 14px;
  border-radius: var(--radius);
  font-size: 0.88rem;
  margin-bottom: 16px;
}

.form-error {
  background: #FBEAEA;
  color: #A3312A;
  padding: 12px 14px;
  border-radius: var(--radius);
  font-size: 0.88rem;
  margin-bottom: 16px;
}

/* ===== Footer ===== */
.site-footer {
  background: var(--ink);
  color: var(--parchment-dim);
  padding: 48px 0 28px;
}

.footer-grid {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 32px;
  margin-bottom: 28px;
}

.footer-grid h3 { color: var(--white); font-size: 1.1rem; }

.footer-contacts a {
  display: block;
  color: var(--parchment-dim);
  text-decoration: none;
  font-size: 0.9rem;
  margin-top: 10px;
}

.footer-contacts a:hover { color: var(--brass-light); }

.footer-bottom {
  border-top: 1px solid rgba(245, 243, 238, 0.12);
  padding-top: 20px;
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--slate);
  flex-wrap: wrap;
  gap: 10px;
}

.footer-bottom a { color: var(--slate); text-decoration: none; }
.footer-bottom a:hover { color: var(--brass-light); }

@media (max-width: 640px) {
  .site-header nav { display: none; }
  .hero { padding: 64px 0 56px; }
}


  .admin-shell { max-width: 720px; margin: 0 auto; padding: 48px 24px 96px; }
  .admin-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 32px; }
  .tabs { display:flex; gap: 8px; margin-bottom: 28px; }
  .tab-btn {
    padding: 10px 18px; border-radius: var(--radius); border: 1px solid var(--parchment-dim);
    background: var(--white); cursor:pointer; font-weight:600; font-size:0.88rem; color: var(--slate);
  }
  .tab-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .panel { display:none; }
  .panel.active { display:block; }
  .card-panel { background: var(--white); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); }
  .image-drop {
    border: 2px dashed var(--parchment-dim); border-radius: var(--radius); padding: 24px;
    text-align:center; color: var(--slate); font-size: 0.88rem; cursor:pointer; margin-bottom: 6px;
  }
  .image-preview-grid { display:flex; flex-wrap:wrap; gap: 8px; margin-top: 12px; }
  .image-preview-grid img { width: 64px; height: 64px; object-fit: cover; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--parchment-dim); vertical-align: top; }
  th { color: var(--slate); font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; }
  .status-new { color: var(--brass); font-weight: 700; font-family: var(--font-mono); font-size: 0.72rem; }
  #login-screen { max-width: 360px; margin: 96px auto; text-align:center; }
  #login-screen .card-panel { text-align: left; }

</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">Peter Siraa <span>Land</span></a>
    <nav><a href="index.html">Back to site</a></nav>
  </div>
</header>

<div id="login-screen">
  <div class="card-panel">
    <h2 style="margin-bottom: 6px;">Admin Login</h2>
    <p style="color: var(--slate); font-size: 0.88rem; margin-bottom: 20px;">Enter the admin password to manage listings and enquiries.</p>
    <div id="login-feedback"></div>
    <form id="login-form">
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autofocus>
      </div>
      <button type="submit" class="btn btn-navy btn-block" id="login-submit">Log In</button>
    </form>
  </div>
</div>

<div class="admin-shell" id="admin-shell" style="display:none;">
  <div class="admin-header">
    <h2>Admin Dashboard</h2>
    <button class="btn btn-outline" style="color: var(--navy); border-color: var(--parchment-dim);" id="logout-btn">Log Out</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="add-listing">Add Land</button>
    <button class="tab-btn" data-tab="enquiries">Enquiries <span id="enquiry-badge"></span></button>
  </div>

  <!-- Add Listing -->
  <div class="panel active" id="panel-add-listing">
    <div class="card-panel">
      <div id="listing-feedback"></div>
      <form id="listing-form">
        <div class="field">
          <label for="l-title">Title</label>
          <input type="text" id="l-title" placeholder="e.g. 1/4 Acre Plot, Kiambu Road" required>
        </div>
        <div class="field">
          <label for="l-location">Location</label>
          <input type="text" id="l-location" placeholder="e.g. Kiambu Road, near XYZ" required>
        </div>
        <div class="field">
          <label for="l-price">Price</label>
          <input type="text" id="l-price" placeholder="e.g. KES 2,500,000">
        </div>
        <div class="field">
          <label for="l-description">Description</label>
          <textarea id="l-description" placeholder="Size, title status, access road, nearby landmarks…"></textarea>
        </div>
        <div class="field">
          <label for="l-whatsapp">WhatsApp number</label>
          <input type="text" id="l-whatsapp" placeholder="254700000000 (no + or spaces)">
        </div>
        <div class="field">
          <label for="l-email">Contact email</label>
          <input type="email" id="l-email" placeholder="siraapeter37@gmail.com">
        </div>
        <div class="field">
          <label for="l-facebook">Facebook link (optional)</label>
          <input type="text" id="l-facebook" placeholder="https://facebook.com/...">
        </div>
        <div class="field">
          <label for="l-instagram">Instagram link (optional)</label>
          <input type="text" id="l-instagram" placeholder="https://instagram.com/...">
        </div>
        <div class="field">
          <label>Images (max 10)</label>
          <div class="image-drop" id="image-drop">Click to choose images, or drag them here</div>
          <input type="file" id="l-images" accept="image/*" multiple style="display:none;">
          <div class="image-preview-grid" id="image-preview"></div>
          <p class="form-note" id="image-count">0 / 10 selected</p>
        </div>
        <button type="submit" class="btn btn-navy btn-block" id="listing-submit">Add Listing</button>
      </form>
    </div>
  </div>

  <!-- Enquiries -->
  <div class="panel" id="panel-enquiries">
    <div class="card-panel">
      <div id="enquiries-content"><p style="color:var(--slate);">Loading enquiries…</p></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
